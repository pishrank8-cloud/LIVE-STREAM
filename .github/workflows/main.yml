name: RDP-UNLIMITED-LOOP
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: 1. Setup User & RDP
      run: |
        $user = "FaizLive"
        $pass = "faiz1611live"
        net user $user $pass /add
        net localgroup administrators $user /add
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: 2. Install Tailscale & Connect
      run: |
        Invoke-WebRequest https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe -OutFile tailscale.exe
        Start-Process tailscale.exe -ArgumentList "/quiet" -Wait
        & "C:\Program Files\Tailscale\tailscale.exe" up --authkey ${{ secrets.TAILSCALE_AUTH_KEY }} --accept-routes
        $ip = (& "C:\Program Files\Tailscale\tailscale.exe" ip -4)
        Write-Host "****************************************************"
        Write-Host "YOUR RDP IP: $ip" -ForegroundColor Yellow -BackgroundColor Red
        Write-Host "Username: FaizLive | Password: $pass"
        Write-Host "****************************************************"

    - name: 3. Timer & Auto-Infinite Restart
      run: |
        # 5 Hours 50 Minutes = 350 Minutes
        $totalMinutes = 350
        $start = Get-Date
        while (((Get-Date) - $start).TotalMinutes -lt $totalMinutes) {
          Write-Output "RDP Session Active... $((Get-Date) - $start)"
          Start-Sleep -Seconds 60
        }
        
        Write-Output "Restarting workflow for unlimited loop..."
        gh workflow run RDP-UNLIMITED-LOOP
      env:
        GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
